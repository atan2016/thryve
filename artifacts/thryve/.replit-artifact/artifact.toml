kind = "web"
previewPath = "/"
title = "Thryve"
version = "1.0.0"
id = "artifacts/thryve"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24986

[services.development]
run = "pnpm --filter @workspace/thryve run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/thryve", "run", "build" ]
publicDir = "artifacts/thryve/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24986"
BASE_PATH = "/"
